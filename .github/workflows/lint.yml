name: Lint workflows

# The reusable workflows only run when a consumer calls them, so nothing else in
# this repository checks a change before it merges. These two jobs are the PR gate:
# actionlint catches invalid syntax and expressions (a `secrets` reference in a
# step-level `if:` once shipped here and failed every caller), and the pin check
# proves each action SHA is the commit its version comment claims.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksums file
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Lint the workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color

  pins:
    name: Verify action pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check every action is pinned to the commit its version comment names
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-action-pins.sh
