name: Build and Deploy Vite App

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
      build-command:
        description: 'Command to build the project'
        required: false
        type: string
        default: 'npm run build'
      install-command:
        description: 'Command to install dependencies'
        required: false
        type: string
        default: 'npm ci'
      lint-command:
        description: 'Command to lint the project'
        required: false
        type: string
        default: 'npm run lint'
      artifact-path:
        description: 'Path to the build output directory'
        required: false
        type: string
        default: 'dist'
      run-lint:
        description: 'Whether to run linting'
        required: false
        type: boolean
        default: true
    secrets:
      build-env-vars:
        description: 'Environment variables to set during build (multiline format: KEY=value)'
        required: false

# Default least-privilege floor for the whole workflow; each job widens only
# what it needs (bounded by what the caller grants). A future job added without
# its own permissions block inherits this read-only floor, not the caller's full grant.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # The build job only reads the repo and uploads the Pages artifact.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run linter
        if: ${{ inputs.run-lint }}
        run: ${{ inputs.lint-command }}

      - name: Set up build environment variables
        run: |
          if [ -n "$BUILD_ENV_VARS" ]; then
            echo "Setting up build environment variables..."
            # Register each VALUE as a mask BEFORE promoting it to $GITHUB_ENV.
            # GitHub only masks the whole multiline `build-env-vars` secret, not
            # its individual lines; once each KEY=VALUE becomes a job-wide env
            # var, GitHub echoes the env context at the start of every later
            # step, which would print each value verbatim in the (public) log.
            # ::add-mask:: registers each value so it is redacted everywhere.
            # Skip short/non-secret values (e.g. numeric flags like FOO=1) so we
            # don't mask common tokens like "1" across the whole log.
            while IFS= read -r line; do
              case "$line" in
                ''|\#*|*=) continue ;;
                *=*) value="${line#*=}" ;;
                *) continue ;;
              esac
              if [ "${#value}" -ge 8 ]; then
                echo "::add-mask::$value"
              fi
            done <<< "$BUILD_ENV_VARS"
            echo "$BUILD_ENV_VARS" >> "$GITHUB_ENV"
          fi
        env:
          BUILD_ENV_VARS: ${{ secrets.build-env-vars }}

      - name: Build project
        run: ${{ inputs.build-command }}

      - name: Verify build output
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          echo "=== Build Output Verification ==="
          echo "Artifact path input: $ARTIFACT_PATH"
          echo "Current working directory: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo ""

          # Resolve absolute path
          if [[ "$ARTIFACT_PATH" = /* ]]; then
            ARTIFACT_DIR="$ARTIFACT_PATH"
          else
            ARTIFACT_DIR="$(pwd)/$ARTIFACT_PATH"
          fi
          echo "Resolved artifact directory: $ARTIFACT_DIR"
          echo ""

          echo "Contents of build directory:"
          ls -laR "$ARTIFACT_DIR"
          echo ""

          echo "Verifying index.html exists:"
          if [ ! -f "$ARTIFACT_DIR/index.html" ]; then
            echo "ERROR: index.html not found in $ARTIFACT_DIR"
            exit 1
          fi
          echo "✓ Build output verified successfully"
          echo ""

          echo "Files that will be uploaded to GitHub Pages:"
          find "$ARTIFACT_DIR" -type f -exec echo "  {}" \;
          echo ""

          echo "Total files: $(find "$ARTIFACT_DIR" -type f | wc -l)"
          echo "Artifact will be uploaded from: $ARTIFACT_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ inputs.artifact-path }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    # The deploy job needs only the scopes required to publish to Pages via OIDC.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: Deployment complete
        run: |
          echo "✅ Site deployed successfully!"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "⚠️  If you see Jekyll errors or 404s:"
          echo "   Go to Repository Settings → Pages → Source"
          echo "   Make sure it's set to 'GitHub Actions' not 'Deploy from a branch'"
