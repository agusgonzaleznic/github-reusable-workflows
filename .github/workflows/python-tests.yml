name: Python Tests

# Runs a Python project's tests on each Python version in a matrix, in a fresh venv that installs
# only hash-locked requirements (pip --require-hashes --no-deps --only-binary :all:), or nothing
# for a project that needs only the standard library (install-requirements: false).
#
# test-command is executed as given: pass only static strings, never event data.
on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON list of Python versions, one job each'
        required: false
        type: string
        default: '["3.12", "3.13"]'
      requirements:
        description: 'Space-separated hash-locked requirement files, relative to the repo root'
        required: false
        type: string
        default: 'requirements.txt'
      install-requirements:
        description: 'false for a project that needs only the standard library: the venv is made, nothing is installed and requirements is ignored'
        required: false
        type: boolean
        default: true
      apt-packages:
        description: 'Space-separated apt packages the tests need'
        required: false
        type: string
        default: ''
      brew-packages:
        description: 'Space-separated Homebrew formulae the tests need; macOS runners only'
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: 'Time limit of each test job, in minutes'
        required: false
        type: number
        default: 15
      pythonpath:
        description: 'PYTHONPATH for the test command, for example src'
        required: false
        type: string
        default: ''
      test-command:
        description: 'Command that runs the tests'
        required: false
        type: string
        default: '.venv/bin/python -m pytest -q'
      runs-on:
        description: 'Runner label for the test jobs'
        required: false
        type: string
        default: 'ubuntu-latest'

# Least-privilege token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  # The job name is half of the callers' required checks ("Tests / Python 3.12"): renaming it
  # is a breaking change.
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install system packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          read -r -a packages <<<"$APT_PACKAGES"
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y --no-install-recommends "${packages[@]}"

      # Each name must look like a formula, so the input cannot pass options to brew. The job's
      # timeout-minutes bounds the install: macOS has no timeout command.
      - name: Install Homebrew packages
        if: inputs.brew-packages != ''
        env:
          BREW_PACKAGES: ${{ inputs.brew-packages }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != macOS ]; then
            echo "FAIL brew-packages needs a macOS runner (runs-on: macos-15, say), not $RUNNER_OS"
            exit 1
          fi
          read -r -a packages <<<"$BREW_PACKAGES"
          for p in "${packages[@]}"; do
            if ! [[ "$p" =~ ^[a-z0-9][a-z0-9@+._/-]*$ ]]; then
              echo "FAIL not a formula name: $p"
              exit 1
            fi
          done
          brew install "${packages[@]}"
          for p in "${packages[@]}"; do brew list --versions "$p"; done

      - name: Create the venv and install the hash-locked requirements
        env:
          INSTALL: ${{ inputs.install-requirements }}
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ "$INSTALL" != true ]; then
            echo "install-requirements is false: the venv holds only the standard library"
            exit 0
          fi
          read -r -a files <<<"$REQUIREMENTS"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "FAIL requirements is empty"
            exit 1
          fi
          args=()
          for f in "${files[@]}"; do args+=(-r "$f"); done
          .venv/bin/pip install --quiet --require-hashes --no-deps --only-binary :all: "${args[@]}"

      - name: Run the tests
        env:
          PYTHONPATH: ${{ inputs.pythonpath }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"
