name: CI for Vite App

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
      build-command:
        description: 'Command to build the project'
        required: false
        type: string
        default: 'npm run build'
      install-command:
        description: 'Command to install dependencies'
        required: false
        type: string
        default: 'npm ci'
      lint-command:
        description: 'Command to lint the project'
        required: false
        type: string
        default: 'npm run lint'
      artifact-path:
        description: 'Path to the build output directory'
        required: false
        type: string
        default: 'dist'
      verify-build-output:
        description: 'Whether to verify build output exists'
        required: false
        type: boolean
        default: true

# Least-privilege token: this workflow only reads the repo and builds.
permissions:
  contents: read

jobs:
  test:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run linter
        run: ${{ inputs.lint-command }}

      - name: Build project
        run: ${{ inputs.build-command }}

      - name: Verify build output
        if: ${{ inputs.verify-build-output }}
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          if [ ! -d "$ARTIFACT_PATH" ]; then
            echo "Error: $ARTIFACT_PATH directory not found"
            exit 1
          fi
          if [ ! -f "$ARTIFACT_PATH/index.html" ]; then
            echo "Error: $ARTIFACT_PATH/index.html not found"
            exit 1
          fi
          echo "Build verification successful!"
          echo "Build output directory exists and contains index.html"
