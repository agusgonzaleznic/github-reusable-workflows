name: Version Tag

# Makes the merge to main the release, so nobody pushes a tag or publishes a release by hand. On a
# push to the default branch it tags the commit with a new version vX.Y.Z, starts the caller's
# release workflow on that tag, waits for it and fails with it. On a pull request it says what the
# merge will release, and fails a change that ships under a version that is already out.
#
# Two ways to choose the version, and the caller names one:
#
# - version: for a package whose files carry their version (Python's __version__, say). The pull
#   request raises it. A pull request that changes a release path needs a version newer than every
#   vX.Y.Z tag. On main a newer version is tagged and released, and main fails when a release path
#   changed since the newest tag while the version stayed, because that change would never ship.
#   An empty version fails, so a typo in the caller cannot fall through to the other way.
# - version-from-tags: true, for a repository whose tags are its only version. On main, when a
#   release path changed since the newest tag, the next version is tagged: the minor version up, or
#   the major version up when a pull request merged since that tag has the label "breaking"; 1.0.0
#   when there is no tag yet.
#
# Only the run of the trunk's current tip tags anything. A re-run of an older commit passes with a
# notice, and the tip's run releases what it carries.
#
# A release is finished when a run of the release workflow on its tag succeeded, or, for a tag no
# run ever released, when the tag has a GitHub release (made before this workflow, say). A run on
# the trunk that brings nothing newer finishes the newest tag's release: it waits for a release run
# that is still going, re-runs the failed jobs of one that failed (an upload to a registry after the
# GitHub release, say), and starts the release when the tag has neither a run nor a GitHub release
# (a run stopped between tagging and starting it). A newer version is tagged and released without
# that step and replaces an unfinished release, so the fix for a release that cannot succeed can
# always ship.
#
# The tag is a lightweight tag made with the caller's token. GitHub starts no workflow for events
# that token causes, except workflow_dispatch, so the release workflow is started with
# workflow_dispatch on the tag: it runs with github.ref set to the tag, as for a pushed tag, and
# needs workflow_dispatch among its triggers.
#
# Permissions: the job declares none and runs with what the caller grants, because a pull request
# and the trunk need different ones. On a pull request, contents: read: the labels come from the
# event. On the trunk, contents: write (the tag), actions: write (to start, watch and re-run the
# release) and, with version-from-tags, pull-requests: read (the labels of the merged pull
# requests).
on:
  workflow_call:
    inputs:
      version:
        description: 'The version the commit ships, X.Y.Z; required unless version-from-tags is true'
        required: false
        type: string
        default: ''
      version-from-tags:
        description: 'Take the next version from the tags instead of version: the minor version up, the major version with the label "breaking"'
        required: false
        type: boolean
        default: false
      release-paths:
        description: 'Paths that ship, one per line: a path ending in / covers everything under it, any other path one file'
        required: true
        type: string
      release-workflow:
        description: 'File name of the workflow, in .github/workflows, started on a new tag'
        required: false
        type: string
        default: 'release.yml'
      runs-on:
        description: 'Runner label for the job'
        required: false
        type: string
        default: 'ubuntu-latest'
    outputs:
      tag:
        description: 'The tag whose release this run started, re-ran or waited for; empty when there was none'
        value: ${{ jobs.version.outputs.tag }}

jobs:
  # The job name is half of the callers' check names ("Release / Check the version" on a pull
  # request): renaming it is a breaking change.
  version:
    name: ${{ github.event_name == 'pull_request' && 'Check the version' || 'Tag the version' }}
    runs-on: ${{ inputs.runs-on }}
    # A run waits for one release run at most, for up to 50 minutes.
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      # The full history and every tag, for git diff and the tag list. The job runs no file from
      # the checkout.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check or tag the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TRUNK: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          VERSION: ${{ inputs.version }}
          VERSION_FROM_TAGS: ${{ inputs.version-from-tags }}
          RELEASE_PATHS: ${{ inputs.release-paths }}
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          fail() { echo "::error::$*"; exit 1; }
          note() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          is_version() { [[ $1 =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; }

          # newer A B: succeeds when version A is newer than version B (numbers, not text).
          newer() {
            local -a a b
            local i
            IFS=. read -r -a a <<<"$1"
            IFS=. read -r -a b <<<"$2"
            for i in 0 1 2; do
              if [ "${a[i]}" -gt "${b[i]}" ]; then return 0; fi
              if [ "${a[i]}" -lt "${b[i]}" ]; then return 1; fi
            done
            return 1
          }

          # Of the tag names on stdin, the newest vX.Y.Z without its v; empty when there is none.
          # Tags of any other shape are left out.
          newest_tag() {
            local best='' t v
            while IFS= read -r t; do
              v=${t#v}
              if ! is_version "$v"; then continue; fi
              if [ -z "$best" ] || newer "$v" "$best"; then best=$v; fi
            done
            printf '%s\n' "$best"
          }

          # The next version after NEWEST: the major version up when BREAKING is yes, else the
          # minor version up; 1.0.0 when there is no tag yet.
          next_version() {
            local major minor patch
            if [ -z "$1" ]; then echo 1.0.0; return; fi
            IFS=. read -r major minor patch <<<"$1"
            : "$patch"
            if [ "$2" = yes ]; then echo "$((major + 1)).0.0"; else echo "$major.$((minor + 1)).0"; fi
          }

          # One of the two ways to choose the version, never by accident.
          if [ "$VERSION_FROM_TAGS" = true ]; then
            if [ -n "$VERSION" ]; then fail "Set version or version-from-tags, not both"; fi
          elif [ -z "$VERSION" ]; then
            fail "The version is empty. Pass the version the commit ships, or set version-from-tags: true to take the next version from the tags"
          elif ! is_version "$VERSION"; then
            fail "The version '$VERSION' is not X.Y.Z (no leading zeros, no suffix)"
          fi

          # The release paths: relative, inside the repository, at least one, and a directory
          # written with its trailing /.
          paths=()
          while IFS= read -r p; do
            p=${p#"${p%%[![:space:]]*}"}
            p=${p%"${p##*[![:space:]]}"}
            if [ -z "$p" ]; then continue; fi
            case "/$p/" in
              //* | */../*) fail "The release path '$p' must be relative and stay inside the repository" ;;
            esac
            if [[ $p != */ ]] && [ "$(git cat-file -t "HEAD:$p" 2>/dev/null || true)" = tree ]; then
              fail "The release path '$p' is a directory: write '$p/' to cover what is under it"
            fi
            paths+=("$p")
          done <<<"$RELEASE_PATHS"
          if [ "${#paths[@]}" -eq 0 ]; then fail "release-paths names no path"; fi

          # The changed files of a git diff range, a rename counted as a deletion and an addition.
          changed() { git diff -z --name-only --no-renames "$@" | tr '\0' '\n'; }

          # Of the file names on stdin, prints those under a release path.
          shipping() {
            local f p
            while IFS= read -r f; do
              for p in "${paths[@]}"; do
                if [[ $p == */ && $f == "$p"* ]] || [[ $f == "$p" ]]; then
                  printf '%s\n' "$f"
                  break
                fi
              done
            done
          }

          # A short list for messages: the first five names, then a count.
          brief() {
            local n
            n=$(grep -c . <<<"$1" || true)
            if [ "$n" -le 5 ]; then paste -sd, - <<<"$1" | sed 's/,/, /g'; else echo "$(head -n 5 <<<"$1" | paste -sd, - | sed 's/,/, /g') and $((n - 5)) more"; fi
          }

          # Succeeds when the tag has a published GitHub release, fails when it has none, and
          # stops the job on any other answer.
          has_release() {
            local out
            if out=$(gh api "repos/$REPO/releases/tags/$1" --jq .tag_name 2>&1); then return 0; fi
            if [[ $out == *"HTTP 404"* ]]; then return 1; fi
            fail "Cannot tell whether $1 has a release: $out"
          }

          # The runs of the release workflow on the tag, in one word and an id: "done" when one
          # succeeded, "active ID" when one is queued or running, "failed ID" (the newest) when all
          # ended otherwise, "none" without a run. It runs inside $(...), so the caller reports a
          # failure: a message printed in here would end up in the variable.
          release_state() {
            gh api "repos/$REPO/actions/workflows/$RELEASE_WORKFLOW/runs?branch=$1&per_page=100" --jq '
              .workflow_runs
              | if any(.[]; .conclusion == "success") then "done"
                elif any(.[]; .status != "completed") then "active \(first(.[] | select(.status != "completed")) | .id)"
                elif length > 0 then "failed \(.[0].id)"
                else "none" end'
          }

          # Waits up to 50 minutes for a run to finish, and fails unless it succeeded.
          watch() {
            local run=$1 tag=$2 url state status conclusion deadline=$((SECONDS + 3000))
            url="https://github.com/$REPO/actions/runs/$run"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            while :; do
              state=$(gh api "repos/$REPO/actions/runs/$run" --jq '[.status, (.conclusion // "")] | join(" ")') || state='unknown '
              status=${state%% *}
              conclusion=${state#* }
              if [ "$status" = completed ]; then break; fi
              if [ "$SECONDS" -ge "$deadline" ]; then fail "The release run of $tag is still '$status' after 50 minutes: $url"; fi
              sleep 20
            done
            if [ "$conclusion" != success ]; then
              fail "The release run of $tag ended '$conclusion': $url. A re-run of this job retries it. When the cause is in the files the tag holds, the fix has to ship as a newer version, which replaces $tag."
            fi
            note "Released $tag: $url"
          }

          # Starts the release workflow on the tag, then watches its run.
          release() {
            local out run
            out=$(gh api --method POST "repos/$REPO/actions/workflows/$RELEASE_WORKFLOW/dispatches" \
              -f ref="$1" -F return_run_details=true 2>&1) || fail "Could not start $RELEASE_WORKFLOW on $1: $out"
            run=$(jq -r '.workflow_run_id // empty' <<<"$out" 2>/dev/null || true)
            if ! [[ $run =~ ^[0-9]+$ ]]; then fail "Started $RELEASE_WORKFLOW on $1, but the answer names no run: $out"; fi
            note "Started $RELEASE_WORKFLOW on $1: https://github.com/$REPO/actions/runs/$run"
            watch "$run" "$1"
          }

          # Re-runs the failed jobs of a release run, waits until the new attempt has started, then
          # watches it: until then the run still reads as completed, with the old conclusion.
          rerun() {
            local run=$1 tag=$2 attempt now out deadline=$((SECONDS + 300))
            attempt=$(gh api "repos/$REPO/actions/runs/$run" --jq .run_attempt) || fail "Cannot read the release run of $tag"
            if ! [[ $attempt =~ ^[0-9]+$ ]]; then fail "Cannot read the attempt of the release run of $tag: '$attempt'"; fi
            out=$(gh api --method POST "repos/$REPO/actions/runs/$run/rerun-failed-jobs" 2>&1) \
              || fail "Could not re-run the failed jobs of the release of $tag: $out"
            note "The release run of $tag failed: re-running its failed jobs, https://github.com/$REPO/actions/runs/$run"
            while :; do
              now=$(gh api "repos/$REPO/actions/runs/$run" --jq .run_attempt) || now=''
              if [[ $now =~ ^[0-9]+$ ]] && [ "$now" -gt "$attempt" ]; then break; fi
              if [ "$SECONDS" -ge "$deadline" ]; then fail "The re-run of the release of $tag has not started after 5 minutes: https://github.com/$REPO/actions/runs/$run"; fi
              sleep 5
            done
            watch "$run" "$tag"
          }

          # Tags this commit, through the API: the tag can never move or be deleted afterwards.
          create_tag() {
            local out
            out=$(gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$1" -f sha="$SHA" 2>&1) \
              || fail "Could not create the tag $1 on $SHA: $out"
            note "Tagged $1 on $SHA"
          }

          # Succeeds when a pull request merged since the tag, up to this commit, has the label
          # "breaking". Fails closed: a lookup that errors stops the job. A commit that reached
          # the trunk without a pull request gets a warning, as no label could mark it.
          breaking_since() {
            local commits c info
            commits=$(git rev-list "$1..$SHA") || fail "Cannot list the commits since $1"
            while IFS= read -r c; do
              if [ -z "$c" ]; then continue; fi
              info=$(gh api "repos/$REPO/commits/$c/pulls" --jq '"\(length) \([.[].labels[].name] | join(","))"') \
                || fail "Cannot read the pull requests of $c"
              if [ "${info%% *}" = 0 ]; then
                echo "::warning::$c reached $TRUNK without a pull request, so no label could mark it breaking"
              fi
              if [[ ",${info#* }," == *,breaking,* ]]; then return 0; fi
            done <<<"$commits"
            return 1
          }

          tags=$(git tag --list 'v*') || fail "Cannot list the tags"
          newest=$(newest_tag <<<"$tags")

          case "$EVENT" in
            pull_request)
              if ! [[ $PR_BASE =~ ^[0-9a-f]{40}$ && $PR_HEAD =~ ^[0-9a-f]{40}$ ]]; then
                fail "The pull_request event names no base and head commits"
              fi
              shipped=$(changed "$PR_BASE...$PR_HEAD" | shipping)
              if [ -z "$shipped" ]; then
                note "Nothing that ships changes here, so this pull request needs no new version."
                exit 0
              fi
              if [ "$VERSION_FROM_TAGS" = true ]; then
                breaking=no
                if jq -e 'index("breaking")' <<<"$PR_LABELS" >/dev/null; then breaking=yes; fi
                next=$(next_version "$newest" "$breaking")
              else
                if [ -n "$newest" ] && ! newer "$VERSION" "$newest"; then
                  fail "This pull request changes files that ship ($(brief "$shipped")), but the version is $VERSION and v$newest is already out. Raise the version."
                fi
                next=$VERSION
              fi
              note "The merge releases v$next: $(brief "$shipped") changed."
              ;;

            push)
              if [ -z "$TRUNK" ] || [ "$REF" != "refs/heads/$TRUNK" ]; then
                fail "Tags are made only from a push to the default branch, not $REF"
              fi
              if ! [[ $RELEASE_WORKFLOW =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]]; then
                fail "release-workflow '$RELEASE_WORKFLOW' is not a workflow file name"
              fi
              tip=$(gh api "repos/$REPO/git/ref/heads/$TRUNK" --jq .object.sha) || fail "Cannot read the tip of $TRUNK"
              if ! [[ $tip =~ ^[0-9a-f]{40}$ ]]; then fail "Cannot read the tip of $TRUNK: the answer was '$tip'"; fi
              if [ "$tip" != "$SHA" ]; then
                note "$TRUNK has moved on to $tip, and that commit's run releases. Nothing to do here."
                exit 0
              fi

              # What this commit releases: a version newer than every tag, or nothing.
              target='' problem=''
              if [ "$VERSION_FROM_TAGS" = true ]; then
                if [ -z "$newest" ]; then
                  target=1.0.0
                else
                  shipped=$(changed "v$newest" "$SHA" | shipping)
                  if [ -n "$shipped" ]; then
                    breaking=no
                    if breaking_since "v$newest"; then breaking=yes; fi
                    target=$(next_version "$newest" "$breaking")
                  fi
                fi
              elif [ -z "$newest" ] || newer "$VERSION" "$newest"; then
                target=$VERSION
              elif [ "$VERSION" != "$newest" ]; then
                fail "The version $VERSION is older than the newest release, v$newest"
              else
                shipped=$(changed "v$newest" "$SHA" | shipping)
                if [ -n "$shipped" ]; then
                  problem="Files that ship changed since v$newest ($(brief "$shipped")), but the version is still $VERSION, so nothing was released. Raise the version in a pull request."
                fi
              fi

              # A newer version is tagged and released at once, and replaces whatever the newest
              # tag's release left unfinished.
              if [ -n "$target" ]; then
                create_tag "v$target"
                release "v$target"
                exit 0
              fi

              # Nothing newer: the newest tag's release has to be finished. Its runs decide; the
              # GitHub release counts only for a tag no run ever released.
              state=$(release_state "v$newest") || fail "Cannot list the runs of $RELEASE_WORKFLOW for v$newest"
              kind=${state%% *}
              run=${state#* }
              case "$kind" in
                done) ;;
                active)
                  note "The release run of v$newest is still going: waiting for it."
                  watch "$run" "v$newest"
                  ;;
                failed) rerun "$run" "v$newest" ;;
                none)
                  if ! has_release "v$newest"; then
                    note "v$newest has a tag but no release: starting its release again."
                    release "v$newest"
                  fi
                  ;;
                *) fail "Cannot read the runs of $RELEASE_WORKFLOW for v$newest: the answer was '$state'" ;;
              esac
              if [ -n "$problem" ]; then fail "$problem"; fi
              note "Nothing to release: v$newest is out, and nothing that ships changed since."
              ;;

            *)
              fail "Runs on pull_request and push events only, not $EVENT"
              ;;
          esac
