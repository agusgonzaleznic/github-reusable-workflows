name: Build Python Package

# Builds the sdist and wheel of the Python project at the repository root with uv and uploads
# them as one artifact, for the calling workflow's publish job. On a tag (a release) it refuses
# a build whose version differs from the tag (v1.2.3 or 1.2.3).
#
# There is no publish step here on purpose. PyPI's Trusted Publishing only trusts a job defined
# in the workflow file registered on PyPI, and a job from another repository's reusable workflow
# never matches it (pypi/warehouse#11096). So the caller keeps one short publish job of its own;
# the README shows it.
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version uv builds with'
        required: false
        type: string
        default: '3.13'
      uv-version:
        description: 'uv version to install (setup-uv verifies its checksum)'
        required: false
        type: string
        default: '0.13.4'
      build-constraints:
        description: 'Hash-locked constraints file for the build backend, relative to the repo root; empty builds with the newest backend the project allows'
        required: false
        type: string
        default: ''
      artifact-name:
        description: 'Name of the artifact that holds dist/'
        required: false
        type: string
        default: 'python-dist'
    outputs:
      version:
        description: 'The version that was built'
        value: ${{ jobs.build.outputs.version }}

# Least-privilege token: this workflow only reads the repo and builds.
permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release build must not restore anything an earlier run could have written.
      - name: Setup uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          enable-cache: false

      - name: Build sdist and wheel
        env:
          BUILD_CONSTRAINTS: ${{ inputs.build-constraints }}
        run: |
          set -euo pipefail
          if [ -n "$BUILD_CONSTRAINTS" ]; then
            uv build --no-sources --out-dir dist --build-constraints "$BUILD_CONSTRAINTS" --require-hashes
          else
            uv build --no-sources --out-dir dist
          fi
          ls -l dist

      - name: Check the version against the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -I - <<'EOF'
          import email.parser, glob, sys, zipfile
          wheels, sdists = glob.glob("dist/*.whl"), glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected one wheel and one sdist in dist/, found {wheels + sdists}")
          with zipfile.ZipFile(wheels[0]) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              print(email.parser.Parser().parsestr(zf.read(name).decode())["Version"])
          EOF
          )
          echo "Built version $version"
          if [ "$REF_TYPE" = tag ]; then
            if [ "${REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $REF_NAME does not match the built version $version"
              exit 1
            fi
          else
            echo "::notice::Not a tag ($REF_NAME), so no tag check"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the built files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
